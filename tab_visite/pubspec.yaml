name: tab_visite
description: Application tablette de visite sur plan interactif (hors-ligne).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.4
  image_picker: ^1.1.2
  pdf: ^3.11.1
  printing: ^5.13.2
  archive: ^3.6.1
  excel: ^4.0.6
  share_plus: ^10.0.2
  uuid: ^4.5.0
  provider: ^6.1.2
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  sqflite_common_ffi: ^2.3.3   # DB en mémoire pour les tests
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/plans/
    - assets/reference/
    - assets/seed/zones.json
